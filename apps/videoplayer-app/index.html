<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom JS Video Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="player">
        <video class="viewer" src="https://googleapis.com"></video>

        <div class="controls">
            <!-- Progress Bar -->
            <div class="progress">
                <div class="progress__filled"></div>
            </div>

            <div class="buttons">
                <button class="toggle" title="Toggle Play">►</button>
                <input type="range" name="volume" class="slider" min="0" max="1" step="0.05" value="1">
                <input type="range" name="playbackRate" class="slider" min="0.5" max="2" step="0.1" value="1">
                <button data-skip="-10" class="skip">« 10s</button>
                <button data-skip="25" class="skip">25s »</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
