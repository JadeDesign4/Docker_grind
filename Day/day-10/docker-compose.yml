services:			# Everthing begins from here.
  cv-app:			# Name of your service (you choose this).
    build: .			# Build Image from Dockerfile in the current folder.
    container_name: ${CONTAINER_NAME}	# Custom name for the container.
    ports:			# Connects the Host to the container.
      - "${PORT}:80"		# Host:Container.
    networks:			# Allows communication with the database.
      - jade-net		# Custom name of the network.

  database:
    image: mariadb:latest	# Database you want to pull Docker Hub.
    container_name: ${DB_NAME}  # Custom name for the db container.
    environment:			# Variable.
      - MY_SQLPASSWD=123secret
    networks:			# Allows communication to the server.
      - jade-net		# Custom name of the network.

networks:			# Allows communication btw the containers
  jade-net:			# Custom Name of the service
    driver: bridge		# The type of network you want the services to communicate on
