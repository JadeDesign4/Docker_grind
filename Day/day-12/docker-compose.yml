services:		# Everything starts from here.
  my-app:		# Name of your service (you choose this).
    image: nginx:alpine		# Image to pull from Docker Hub.
    container_name: ${CONTAINER_NAME}	# Name of your container (you choose this).
    ports: 		# Connects Host to the container.
      - "${PORT}:80"	# Host:Container.
    volumes:		# Connects Host files to Container folders.
      - ${FOLDER}:/usr/share/nginx/html:ro  # HostPath:ContainerPath
    logging:		# Saves the logs of the container when running.
      driver: "json-file"	# Format to save the logs.
      options:			# Extra settings for logging.
        max-size: "5m"		# Maximum size of log files should not exceed 5mb.
        max-file: "2"		# Maximum stored files should not exceed 2.
    restart: unless-stopped # Keeps the container alive if it crashes or Pc reboots.
